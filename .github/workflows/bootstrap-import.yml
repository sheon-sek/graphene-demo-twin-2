name: Bootstrap repository import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ hashFiles('.bootstrap/chunk-*') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import repository archive
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cat .bootstrap/chunk-* | base64 --decode > "$RUNNER_TEMP/graphene-repo.tar.gz"
          tar -xzf "$RUNNER_TEMP/graphene-repo.tar.gz" -C "$workdir"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$workdir"/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Graphene Virtual World Engine"
          git push origin HEAD:main
