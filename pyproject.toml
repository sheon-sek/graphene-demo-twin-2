[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "graphene-demo-twin"
version = "0.1.0"
description = "Deterministic Graphene-compatible virtual data-centre world engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "asyncua>=2.0.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
graphene-twin = "graphene_demo_twin.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphene_demo_twin"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
